# =========== SERVER ==============
server:
  port: 8080
  servlet:
    context-path: /api

# =========== SPRING ==============
spring:
  application:
    name: tasks

  datasource:
    url: jdbc:mysql://localhost:3306/taskdb
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}

  jpa:
    hibernate:
      ddl-auto: update

    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
    show-sql: true
    open-in-view: false

# =========== JWT ==============
jwt:
  secret: ${JWT_SECRET:EstaEsUnaClaveSecretaSuperLargaYSeguraParaJWT2026ScrumIt}
  expiration: 86400000

# =========== SPRINGDOC ==============
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    org.springframework.security: DEBUG